<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jairison-Dev</title>

    <link rel="stylesheet" href="orcamento.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="voltar">

            <button onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar
            </button>

        </div>

        <div class="card">

            <i class="fa-solid fa-calendar-check icon"></i>

            <h1>Orçamento</h1>

            <p>Preencha os dados abaixo.</p>

            <form id="formulario">

                <div class="input-box">

                    <label>Nome e Sobrenome </label>

                    <input type="text" id="nome" placeholder="Seu nome" required>

                </div>

                <div class="input-box">

                    <label>WhatsApp</label>

                    <input type="tel" id="telefone" placeholder="(85) 99999-9999" required>

                </div>

                <div class="input-box">

                    <label>Projeto Desejado</label>

                    <select id="servico">

                        <option>Selecione</option>

                        <option>Midia Kit</option>

                        <option>Link Page</option>

                        <option>Landing Page</option>

                        <option>Site Institucional</option>

                        <option>Portifólio</option>

                        <option>Seistema Web</option>

                        <option>Loja Virtual</option>

                        <option>Manutenção</option>

                        <option>Outro</option>

                    </select>

                </div>

                <div class="entrega">

                    <div class="input-box">

                        <label>Tempo Estimado</label>

                        <select id="orçamento">

                            <option> 7 Dias </option>

                            <option> 10 Dias</option>

                            <option> 15 Dias </option>

                            <option> 1 Mês </option>

                        </select>

                    </div>

                </div>

                <div class="dupla">

                    <div class="input-box">

                        <label>Valor Desejado</label>

                        <select id="orçamento">

                            <option>Até R$ 500</option>

                            <option>R$ 1.000 - R$ 3.000</option>

                            <option>R$ 3.000 - R$ 5.000</option>

                            <option>Acima de R$ 5.000</option>

                        </select>

                    </div>

                </div>

                <div class="input-box">

                    <label>Descreva Seu Projeto</label>

                    <textarea id="obs" rows="4" placeholder="Escreva alguma observação..."></textarea>

                </div>

                <button type="button" onclick="agendarWhatsApp()">

                    <i class="fa-brands fa-whatsapp"></i>

                    Enviar Solicitação

                </button>

            </form>

        </div>

    </div>

    <script src="orcamento.js"></script>

</body>

</html>
